services:
  9001ft:
    container_name: 9001ft
    hostname: 9001ft
    build:
      context: .
    restart: unless-stopped
    ports:
      # Only this machine can reach it: anyone who can reach it can fetch any
      # page through it. 5013 because macOS AirPlay Receiver holds port 5000.
      - "127.0.0.1:5013:5000"
      # On a home server, reach it from your other devices by binding to the
      # server's LAN address instead (and set LADDER_PASSWORD in .env.local).
      # See "Run it on a home server" in the README.
      # - "192.0.2.10:5013:5000"
    # Optional settings such as AI tidy and LADDER_PASSWORD (see README).
    # Inside Docker, reach a model running on your computer at
    # http://host.docker.internal:11434/v1.
    env_file:
      - path: .env.local
        required: false
    # Settings saved on the /settings page (including any API keys) and the
    # login key live here.
    volumes:
      - ./data:/data
    # The image's HEALTHCHECK calls /healthz, so `docker ps` shows "healthy".
